name: Build and Deploy Angular Travel PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build Angular PWA (Production)
        run: npx ng build --configuration production --base-href /TravelAPP/
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Copy index.html as 404.html (SPA fallback for GitHub Pages)
        run: cp ./dist/travel-app/browser/index.html ./dist/travel-app/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/travel-app/browser
          force_orphan: true
          enable_jekyll: false
